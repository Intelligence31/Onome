<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For Alex Onome Natasha ♡</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body class="landing">


    <div class="glow glow-one"></div>

    <div class="glow glow-two"></div>


    <main class="hero">


        <p class="eyebrow">
            A little something from
        </p>


        <div class="brand">
            INTELLIGENCE
        </div>


        <p class="date">
            OCTOBER 7TH · 2026
        </p>


        <h1>

            Someone special<br>

            is about to have a<br>

            <em>beautiful day.</em>

        </h1>


        <p class="intro">

            Counting down to the birthday of

            <strong>
                Alex O Natasha.
            </strong>

        </p>


        <!-- COUNTDOWN -->

        <div class="countdown">


            <div class="time-box">

                <span id="days">
                    00
                </span>

                <small>
                    DAYS
                </small>

            </div>


            <div class="colon">
                :
            </div>


            <div class="time-box">

                <span id="hours">
                    00
                </span>

                <small>
                    HOURS
                </small>

            </div>


            <div class="colon">
                :
            </div>


            <div class="time-box">

                <span id="minutes">
                    00
                </span>

                <small>
                    MINUTES
                </small>

            </div>


            <div class="colon">
                :
            </div>


            <div class="time-box">

                <span id="seconds">
                    00
                </span>

                <small>
                    SECONDS
                </small>

            </div>


        </div>


        <a
            class="button"
            href="surprise.html"
        >

            Open your surprise

            <span>
                →
            </span>

        </a>


        <p class="tiny">
            Made with care, just for Alex ♡
        </p>


    </main>


    <div class="sparkles">
        ✦　·　✧　·　♡　·　✦
    </div>


    <script src="script.js"></script>

</body>

</html>
